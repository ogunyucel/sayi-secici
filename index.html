<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayı Seçici 📱</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            /* Mobilde aşağı yukarı kaymayı engellemek için */
            overflow: hidden; 
        }
        
        .container { 
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; width: 90%; max-width: 450px; 
            position: relative; 
        }

        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 38px; }
        p { color: #34495e; font-size: 22px; font-weight: 600; margin-bottom: 25px; }
        
        .btn-redirect-main, .btn-close {
            position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
            background-color: #ff4d4d; color: white; text-decoration: none; border: none; border-radius: 50%;
            cursor: pointer; font-size: 20px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); line-height: 1; z-index: 100; padding: 0;
        }
        .btn-redirect-main:hover, .btn-close:hover { background-color: #ff0000; transform: scale(1.1); }
        
        .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px;}
        .btn-level { 
            background-color: #9b59b6; color: white; padding: 15px 0; font-size: 26px; margin: 0;
            border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .btn-level:hover { background-color: #8e44ad; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.15);}
        
        .hidden { display: none !important; }

        #score-board { 
            margin-bottom: 20px; margin-top: 35px; background: #f8f9fa; padding: 15px; 
            padding-right: 50px; border-radius: 15px; display: flex; flex-direction: column;
            gap: 8px; position: relative; border: 2px solid #ecf0f1;
            cursor: pointer; transition: background-color 0.2s ease;
        }
        #score-board:hover { background-color: #e9ecef; }
        #score-board:hover .btn-inspect { color: #9b59b6; }
        
        .main-stats { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .sub-stats { font-size: 15px; font-weight: bold; display: flex; justify-content: center; gap: 8px; align-items: center;}
        
        .stat-correct { color: #27ae60; }
        .stat-wrong { color: #e74c3c; }
        .stat-divider { color: #bdc3c7; }

        .btn-inspect {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            display: flex; flex-direction: column;
            align-items: center; font-size: 12px; font-weight: bold; color: #2c3e50; transition: 0.2s; padding: 0;
        }
        .btn-inspect span { font-size: 24px; margin-bottom: 2px; }

        .equation-area {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            margin: 40px 0; font-size: 45px; font-weight: 900; color: #2c3e50;
        }

        .static-box {
            padding: 0 15px; background: #ecf0f1; border-radius: 15px; height: 70px;
            border: 3px solid #bdc3c7; min-width: 70px; display: flex; align-items: center; justify-content: center;
        }

        .operator { font-size: 40px; color: #7f8c8d; }

        .picker-wrapper { 
            position: relative; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 5px;
        }

        .ios-picker-container {
            height: 180px; width: 100px; position: relative;
            overflow-y: auto; scroll-snap-type: y mandatory; 
            background: linear-gradient(to bottom, #b3bcc1 0%, #f8f9fa 30%, #f8f9fa 70%, #b3bcc1 100%);
            border-radius: 15px;
            border: 1px solid #bdc3c7; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 25px 20px -15px rgba(0,0,0,0.5), inset 0 -25px 20px -15px rgba(0,0,0,0.5); 
            transition: all 0.3s ease; cursor: grab; scrollbar-width: none; -ms-overflow-style: none;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            /* MOBİL (WEBKIT) DESTEKLERİ EKLENDİ */
            perspective: 300px;
            -webkit-perspective: 300px;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }
        
        .ios-picker-container:active { cursor: grabbing; }
        .ios-picker-container::-webkit-scrollbar { display: none; }

        .ios-picker-highlight {
            position: absolute; top: 60px; height: 60px; width: 100%;
            background: rgba(0, 0, 0, 0.03); pointer-events: none; z-index: -1;
            transition: border-color 0.3s;
        }

        .ios-picker-list { 
            margin: 0; padding: 0; list-style: none; padding-top: 60px; padding-bottom: 60px; 
            position: relative; /* JS hesaplaması şaşmasın diye */
        }

        .ios-picker-item {
            height: 60px; display: flex; justify-content: center; align-items: center;
            font-size: 45px; font-weight: 900; 
            scroll-snap-align: center; user-select: none;
            transform-origin: center center; 
            -webkit-transform-origin: center center;
            /* Mobilde kasmayı önlemek için */
            will-change: transform, opacity;
        }

        .ios-picker-container.success {
            background: linear-gradient(to bottom, #95d5b2 0%, #d8f3dc 30%, #d8f3dc 70%, #95d5b2 100%);
            border-color: #27ae60; box-shadow: 0 0 20px rgba(39, 174, 96, 0.5); pointer-events: none; 
        }
        .ios-picker-container.error {
            background: linear-gradient(to bottom, #f5b7b1 0%, #fadbd8 30%, #fadbd8 70%, #f5b7b1 100%);
            border-color: #e74c3c; box-shadow: 0 0 20px rgba(231, 76, 60, 0.5); pointer-events: none; 
        }

        #message { height: 30px; font-weight: bold; margin-top: 10px; font-size: 22px; transition: 0.3s; color: #34495e; }

        .table-list {
            display: flex; justify-content: space-between; gap: 15px;
            margin-top: 15px; padding: 15px; background: #f8f9fa;
            border-radius: 15px; border: 2px solid #ecf0f1;
        }
        .table-column { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .table-row { font-size: 17px; font-weight: bold; padding-bottom: 5px; border-bottom: 1px dashed #ddd; text-align: left; white-space: nowrap; }
        .row-correct { color: #27ae60; }
        .row-wrong { color: #e74c3c; }
        .row-unanswered { color: #7f8c8d; }

        .btn-mistakes {
            background-color: #e67e22; color: white; padding: 15px; font-size: 20px;
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            width: 100%; margin-top: 15px; transition: 0.3s;
        }
        .btn-mistakes:hover { background-color: #d35400; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(230, 126, 34, 0.4); }

        /* MOBİL EKRANLAR İÇİN DÜZELTMELER (SIKIŞMAYI ÖNLER) */
        @media (max-width: 480px) {
            .container { padding: 20px 15px; width: 95%; }
            .equation-area { font-size: 35px; gap: 5px; margin: 25px 0; }
            .static-box { min-width: 55px; height: 60px; padding: 0 10px; border-width: 2px; }
            .ios-picker-container { width: 85px; }
            .operator { font-size: 30px; }
            .ios-picker-item { font-size: 40px; } 
        }

    </style>
</head>
<body>

<div id="level-screen" class="container">
    <a href="https://matfabe.com/oyunlar/" class="btn-redirect-main">×</a>
    <h1>Sayı Seçici 📱</h1>
    <p>Seviyeni seç ve oyuna başla!</p>
    <div class="level-grid" id="levels"></div>
</div>

<div id="game-screen" class="container hidden">
    <button class="btn-close" onclick="endGame()">×</button>
    
    <div id="score-board" onclick="openInspectScreen()">
        <div class="main-stats">Skor: <span id="score-display">0</span> | Seviye: <span id="level-display">6</span><span id="level-suffix">'lar</span></div>
        <div class="sub-stats">
            <span class="stat-correct">✔ Doğru: <span id="count-correct">0</span></span>
            <span class="stat-divider">|</span>
            <span class="stat-wrong">✖ Yanlış: <span id="count-wrong">0</span></span>
        </div>
        <div class="btn-inspect">
            <span>🔍</span>
            İncele
        </div>
    </div>

    <div class="equation-area" id="equation-area"></div>

    <p id="message">Sayıyı doğru yöne kaydır!</p>
</div>

<div id="inspect-screen" class="container hidden">
    <button class="btn-close" onclick="closeInspectScreen()">×</button>
    
    <div id="score-board" style="padding-right: 15px; cursor: default;">
        <div class="main-stats">Skor: <span id="insp-score">0</span></div>
        <div class="sub-stats">
            <span class="stat-correct">✔ Doğru: <span id="insp-correct">0</span></span>
            <span class="stat-divider">|</span>
            <span class="stat-wrong">✖ Yanlış: <span id="insp-wrong">0</span></span>
        </div>
    </div>

    <h2 style="color: #2c3e50; margin: 10px 0;"><span id="insp-level-title">6</span><span id="insp-level-suffix">'lar</span> Çarpım Tablosu</h2>
    <div id="table-list" class="table-list"></div>
    <button class="btn-mistakes" onclick="startMistakeMode()">Sadece Yanlışlara Çalış</button>
</div>

<script>
    let currentLevel = 1;      
    let correctMultiplier = 1; 
    let initialValue = 1; 

    let isChecking = false; 
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let historyData = {}; 

    let isMistakeMode = false;
    let mistakeQueue = [];
    
    let needsNewQuestion = false;
    let savedScrollTop = 0;

    function updatePicker3D() {
        const container = document.getElementById('ios-picker');
        if (!container) return;
        const list = document.getElementById('picker-list');
        // Mobilde ve masaüstünde yüksekliği dinamik alalım ki şaşmasın
        const itemElement = list.querySelector('.ios-picker-item');
        if (!itemElement) return;
        const itemHeight = itemElement.offsetHeight || 60;
        
        const containerCenter = container.scrollTop + (container.clientHeight / 2);

        Array.from(list.children).forEach((item) => {
            const itemCenter = item.offsetTop + (itemHeight / 2);
            const distance = itemCenter - containerCenter;
            const absDistance = Math.abs(distance);
            
            const angle = (distance / itemHeight) * 35; 
            const scale = Math.max(0.6, 1 - (absDistance / 350)); 
            const opacity = Math.max(0, 1 - (absDistance / 160));

            const curveX = -(Math.pow(absDistance / 60, 2) * 2.5); 
            const pushZ = -absDistance * 0.4;

            if (absDistance > 140) {
                item.style.opacity = 0;
                item.style.visibility = 'hidden';
            } else {
                item.style.visibility = 'visible';
                
                // MOBİL İÇİN WEBKIT DESTEKLİ TRANSFORM
                const transformString = `translateX(${curveX}px) translateZ(${pushZ}px) rotateX(${-angle}deg) scale(${scale})`;
                item.style.transform = transformString;
                item.style.webkitTransform = transformString; 
                
                if (absDistance < 20) {
                    item.style.color = "#2c3e50"; 
                    item.style.opacity = 1;
                } else {
                    item.style.color = "#7f8c8d"; 
                    item.style.opacity = opacity;
                }
            }
        });
    }

    function showScreen(screenId) {
        document.getElementById('level-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('inspect-screen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    function generateLevelButtons() {
        const levelsDiv = document.getElementById('levels');
        levelsDiv.innerHTML = ""; 
        for (let i = 1; i <= 9; i++) {
            let btn = document.createElement('button');
            btn.innerText = i;
            btn.className = "btn-level";
            btn.onclick = () => startLevel(i);
            levelsDiv.appendChild(btn);
        }
    }
    window.onload = generateLevelButtons;

    function startLevel(level) {
        currentLevel = level;
        document.getElementById('level-display').innerText = level;
        
        let suffix = [1, 2, 3, 4, 5, 7, 8].includes(level) ? "'ler" : "'lar";
        document.getElementById('level-suffix').innerText = suffix;
        document.getElementById('insp-level-title').innerText = level;
        document.getElementById('insp-level-suffix').innerText = suffix;
        
        isMistakeMode = false;
        mistakeQueue = [];
        score = 0; correctCount = 0; wrongCount = 0;
        historyData = {}; 
        updateScoreBoard();

        showScreen('game-screen');
        generateQuestion();
    }

    function updateScoreBoard() {
        document.getElementById('score-display').innerText = score;
        document.getElementById('count-correct').innerText = correctCount;
        document.getElementById('count-wrong').innerText = wrongCount;
    }

    function generateQuestion() {
        isChecking = false;
        const msgBox = document.getElementById('message');
        msgBox.innerText = "Sayıyı doğru yöne kaydır!";
        msgBox.style.color = "#34495e";

        if (isMistakeMode) {
            const randomIndex = Math.floor(Math.random() * mistakeQueue.length);
            correctMultiplier = mistakeQueue[randomIndex];
        } else {
            correctMultiplier = Math.floor(Math.random() * 10) + 1; 
        }

        const result = currentLevel * correctMultiplier;

        let offset = Math.random() > 0.5 ? 1 : -1;
        initialValue = correctMultiplier + offset;
        
        if(initialValue < 1) initialValue = 10;
        if(initialValue > 10) initialValue = 1;

        let isPickerOnLeft = Math.random() > 0.5;

        const eqArea = document.getElementById('equation-area');
        
        let listItemsHTML = "";
        for(let loop = 0; loop < 40; loop++) {
            for(let n=1; n<=10; n++) {
                listItemsHTML += `<li class="ios-picker-item">${n}</li>`;
            }
        }

        let pickerHTML = `
            <div class="picker-wrapper">
                <div class="ios-picker-container" id="ios-picker">
                    <div class="ios-picker-highlight"></div>
                    <ul class="ios-picker-list" id="picker-list">
                        ${listItemsHTML}
                    </ul>
                </div>
            </div>
        `;
        
        let staticHTML = `<div class="static-box">${currentLevel}</div>`;
        let resultHTML = `<div class="operator">=</div><div class="static-box">${result}</div>`;
        let operatorHTML = `<div class="operator">×</div>`;

        if (isPickerOnLeft) {
            eqArea.innerHTML = pickerHTML + operatorHTML + staticHTML + resultHTML;
        } else {
            eqArea.innerHTML = staticHTML + operatorHTML + pickerHTML + resultHTML;
        }

        // DOM'un tam renderlanmasını bekleyip efektleri basıyoruz
        setTimeout(() => {
            const container = document.getElementById('ios-picker');
            let initialGlobalIndex = (20 * 10) + (initialValue - 1);
            
            container.onscroll = null; 
            container.scrollTop = initialGlobalIndex * 60; 
            
            setupScrollListener(initialGlobalIndex);
            setupDragListener(); 
            // İlk yüklemede 3D basılsın
            window.requestAnimationFrame(updatePicker3D);
        }, 50);
    }

    // MOBİL DOKUNMATİK DESTEKLİ SÜRÜKLEME
    function setupDragListener() {
        const container = document.getElementById('ios-picker');
        let isDragging = false;
        let startY;
        let startScrollTop;

        const handleStart = (y) => {
            if (isChecking) return;
            isDragging = true;
            container.style.scrollSnapType = 'none'; 
            startY = y;
            startScrollTop = container.scrollTop;
        };

        const handleEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            container.style.scrollSnapType = 'y mandatory'; 
            
            const itemElement = document.querySelector('.ios-picker-item');
            const itemHeight = itemElement ? itemElement.offsetHeight : 60; 
            const index = Math.round(container.scrollTop / itemHeight);
            container.scrollTo({ top: index * itemHeight, behavior: 'smooth' });
        };

        const handleMove = (y, e) => {
            if (!isDragging) return;
            e.preventDefault(); 
            const distance = (y - startY); 
            container.scrollTop = startScrollTop - distance;
        };

        // Mouse (Masaüstü)
        container.onmousedown = (e) => handleStart(e.clientY);
        container.onmouseleave = handleEnd;
        container.onmouseup = handleEnd;
        container.onmousemove = (e) => handleMove(e.clientY, e);

        // Dokunmatik (Mobil) - Telefonlarda kaydırmanın sırrı burası
        container.ontouchstart = (e) => handleStart(e.touches[0].clientY);
        container.ontouchend = handleEnd;
        container.ontouchcancel = handleEnd;
        container.ontouchmove = (e) => handleMove(e.touches[0].clientY, e);
    }

    function setupScrollListener(startIndex) {
        const container = document.getElementById('ios-picker');
        const list = document.getElementById('picker-list');
        
        let lastCheckedValue = initialValue;
        let isTicking = false;

        container.onscroll = () => {
            // Mobilde kasmaması için requestAnimationFrame ile güncelliyoruz
            if (!isTicking) {
                window.requestAnimationFrame(() => {
                    updatePicker3D();
                    isTicking = false;
                });
                isTicking = true;
            }

            if (isChecking) return;
            
            const itemElement = document.querySelector('.ios-picker-item');
            const itemHeight = itemElement ? itemElement.offsetHeight : 60; 

            let index = Math.round(container.scrollTop / itemHeight);
            
            if(index < 0) index = 0;
            if(index >= list.children.length) index = list.children.length - 1;

            let selectedValue = (index % 10) + 1; 

            if (selectedValue !== lastCheckedValue) {
                lastCheckedValue = selectedValue;
                
                if (selectedValue === correctMultiplier) {
                    handleCorrectAnswer(container);
                } else if (selectedValue !== initialValue) {
                    handleWrongAnswer(container);
                }
            }
        };
    }

    function handleCorrectAnswer(container) {
        isChecking = true;
        const msgBox = document.getElementById('message');

        container.style.overflowY = 'hidden'; 
        container.classList.add('success');
        
        msgBox.innerText = "Tebrikler! 🎉";
        msgBox.style.color = "#27ae60";

        score += 10;
        
        if (isMistakeMode) {
            historyData[correctMultiplier] = 'correct';
            if (wrongCount > 0) wrongCount--;
            correctCount++;
            updateScoreBoard();

            mistakeQueue = mistakeQueue.filter(m => m !== correctMultiplier);
            
            if (mistakeQueue.length === 0) {
                setTimeout(() => {
                    alert("Tebrikler! Tüm yanlışlarını öğrendin. 🎉");
                    isMistakeMode = false;
                    needsNewQuestion = true; 
                    openInspectScreen(); 
                }, 1000);
                return;
            }
        } else {
            correctCount++;
            updateScoreBoard();
            
            if(historyData[correctMultiplier] !== 'wrong') {
                historyData[correctMultiplier] = 'correct';
            }
        }

        setTimeout(() => { generateQuestion(); }, 1200);
    }

    function handleWrongAnswer(container) {
        isChecking = true;
        const msgBox = document.getElementById('message');

        container.style.overflowY = 'hidden'; 
        container.classList.add('error'); 
        
        msgBox.innerText = "Maalesef Yanlış! ❌";
        msgBox.style.color = "#e74c3c";

        wrongCount++;
        updateScoreBoard();
        historyData[correctMultiplier] = 'wrong';

        setTimeout(() => { generateQuestion(); }, 1400); 
    }

    function endGame() {
        if (isMistakeMode) {
            isMistakeMode = false;
            openInspectScreen(); 
        } else {
            if(confirm("Oyunu bitirmek ve seviye seçimine dönmek istiyor musun?")) {
                showScreen('level-screen'); 
            }
        }
    }

    function openInspectScreen() {
        const container = document.getElementById('ios-picker');
        if (container) savedScrollTop = container.scrollTop; 

        showScreen('inspect-screen');
        
        document.getElementById('insp-score').innerText = score;
        document.getElementById('insp-correct').innerText = correctCount;
        document.getElementById('insp-wrong').innerText = wrongCount;
        document.getElementById('insp-level-title').innerText = currentLevel;
        
        let suffix = [1, 2, 3, 4, 5, 7, 8].includes(currentLevel) ? "'ler" : "'lar";
        document.getElementById('insp-level-suffix').innerText = suffix;

        const listDiv = document.getElementById('table-list');
        listDiv.innerHTML = "";

        let col1 = document.createElement('div');
        col1.className = "table-column";
        let col2 = document.createElement('div');
        col2.className = "table-column";

        for(let i = 1; i <= 10; i++) {
            let div = document.createElement('div');
            div.className = "table-row";
            
            let statusHTML = "";
            let rowClass = "row-unanswered";

            if (historyData[i] === 'correct') {
                statusHTML = "✔ ";
                rowClass = "row-correct";
            } else if (historyData[i] === 'wrong') {
                statusHTML = "✖ ";
                rowClass = "row-wrong";
            } else {
                statusHTML = "<span style='opacity:0;'>✔ </span>"; 
            }

            div.innerHTML = `<span class="${rowClass}">${statusHTML} ${currentLevel} x ${i} = ${currentLevel * i}</span>`;
            
            if (i <= 5) {
                col1.appendChild(div);
            } else {
                col2.appendChild(div);
            }
        }
        listDiv.appendChild(col1);
        listDiv.appendChild(col2);
    }

    function closeInspectScreen() {
        showScreen('game-screen');
        
        if (needsNewQuestion) {
            generateQuestion();
            needsNewQuestion = false;
        } else {
            const container = document.getElementById('ios-picker');
            if (container) {
                container.onscroll = null; 
                container.scrollTop = savedScrollTop; 
                
                setTimeout(() => {
                    let initialGlobalIndex = Math.round(savedScrollTop / 60);
                    setupScrollListener(initialGlobalIndex);
                }, 50);
            }
        }
    }

    function startMistakeMode() {
        mistakeQueue = [];
        for (let i = 1; i <= 10; i++) {
            if (historyData[i] === 'wrong') mistakeQueue.push(i);
        }
        if (mistakeQueue.length === 0) {
            alert("Harika! Hiç yanlışınız yok.");
            return;
        }
        isMistakeMode = true;
        showScreen('game-screen');
        generateQuestion();
    }
</script>
</body>
</html>
